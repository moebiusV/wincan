# every directive once (authorize twice)
listen 127.0.0.1
port 8766
tls yes
insecure no
official-klines yes
certificate "/etc/candled/server.crt"
key "/etc/candled/server.key"
authorized "/etc/candled/authorized-clients"
authorize "SHA256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
authorize "SHA256:FEDCBA9876543210FEDCBA9876543210FEDCBA9876543210FEDCBA9876543210"
candles "/var/lib/candled/candles"
backfill "/var/lib/candled/candles-spot"
database "/var/lib/candled/candles.db"
live-bins "/var/lib/candled/bins"
heat-db "/var/lib/candled/heat.db"
