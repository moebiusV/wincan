<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-labelledby="t d">
  <title id="t">wincan architecture</title>
  <desc id="d">A collector writes candle files or a SQLite database. candled, on Linux or WSL2, reads them and serves them over TLS to wincan.exe on the Windows desktop, to a client whose key is authorized by fingerprint.</desc>
  <rect width="900" height="230" rx="14" fill="#0e1218"/>
  <g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="30" y="55" width="220" height="110" rx="12" fill="#161d27" stroke="#2d3a4b"/>
      <text x="140" y="98" font-size="22" font-weight="700" fill="#d6dce2">collector</text>
      <text x="140" y="126" font-size="14" fill="#8aa4bd">tick files · SQLite</text>
      <text x="140" y="146" font-size="12" fill="#5f7184">anything that writes candles</text>
    </g>
    <g>
      <rect x="340" y="55" width="220" height="110" rx="12" fill="#161d27" stroke="#3a7f5a" stroke-width="2"/>
      <text x="450" y="98" font-size="22" font-weight="700" fill="#5ed592">candled</text>
      <text x="450" y="126" font-size="14" fill="#8aa4bd">Linux · WSL2 · Debian · Alpine</text>
      <text x="450" y="146" font-size="12" fill="#5f7184">the candle supply</text>
    </g>
    <g>
      <rect x="650" y="55" width="220" height="110" rx="12" fill="#161d27" stroke="#3b6ea5" stroke-width="2"/>
      <text x="760" y="98" font-size="22" font-weight="700" fill="#6fb1ff">wincan.exe</text>
      <text x="760" y="126" font-size="14" fill="#8aa4bd">Windows desktop</text>
      <text x="760" y="146" font-size="12" fill="#5f7184">one file, nothing else needed</text>
    </g>
    <rect x="252" y="108.75" width="74" height="2.5" fill="#8aa4bd"/>
    <polygon points="338,110 324,103 324,117" fill="#8aa4bd"/>
    <text x="294" y="98" font-size="12" fill="#8aa4bd">reads</text>
    <rect x="562" y="108.75" width="74" height="2.5" fill="#8aa4bd"/>
    <polygon points="648,110 634,103 634,117" fill="#8aa4bd"/>
    <text x="604" y="98" font-size="12" fill="#8aa4bd">TLS</text>
    <g transform="translate(604 128)">
      <rect x="-9" y="6" width="18" height="14" rx="2" fill="#e8c35a"/>
      <rect x="-6" y="-3" width="2.6" height="9" fill="#e8c35a"/><rect x="3.4" y="-3" width="2.6" height="9" fill="#e8c35a"/><rect x="-6" y="-3" width="12" height="2.6" fill="#e8c35a"/>
    </g>
    <text x="450" y="205" font-size="13" fill="#8aa4bd">TLS 1.2+ · the client's own key, authorized by its fingerprint · the server's certificate pinned</text>
  </g>
</svg>
