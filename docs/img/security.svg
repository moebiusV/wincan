<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="t d">
  <title id="t">Keys, not passwords</title>
  <desc id="d">Four steps: wincan makes its own key; its fingerprint is authorized on the server; candled answers only that key; wincan pins the server's certificate.</desc>
  <rect width="900" height="250" rx="14" fill="#0e1218"/>
  <g font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <g transform="translate(20 30)">
      <rect width="200" height="190" rx="12" fill="#161d27" stroke="#2d3a4b"/>
      <circle cx="30" cy="34" r="16" fill="#3b6ea5"/><text x="30" y="40" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="14" y="82" font-size="15" font-weight="700" fill="#d6dce2">The client makes</text>
      <text x="14" y="102" font-size="15" font-weight="700" fill="#d6dce2">its own key</text>
      <text x="14" y="128" font-size="12" fill="#8aa4bd">in your certificate store,</text>
      <text x="14" y="145" font-size="12" fill="#8aa4bd">not exportable: the private</text>
      <text x="14" y="162" font-size="12" fill="#8aa4bd">key never leaves the PC</text>
    </g>
    <g transform="translate(240 30)">
      <rect width="200" height="190" rx="12" fill="#161d27" stroke="#2d3a4b"/>
      <circle cx="30" cy="34" r="16" fill="#3b6ea5"/><text x="30" y="40" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="14" y="82" font-size="15" font-weight="700" fill="#d6dce2">The server is told</text>
      <text x="14" y="102" font-size="15" font-weight="700" fill="#d6dce2">its fingerprint</text>
      <text x="14" y="128" font-size="12" fill="#8aa4bd">candled --authorize</text>
      <text x="14" y="145" font-size="12" fill="#e8c35a" font-family="Consolas, Menlo, monospace">SHA256:…</text>
      <text x="14" y="162" font-size="12" fill="#8aa4bd">like IRC's certfp</text>
    </g>
    <g transform="translate(460 30)">
      <rect width="200" height="190" rx="12" fill="#161d27" stroke="#2d3a4b"/>
      <circle cx="30" cy="34" r="16" fill="#3a7f5a"/><text x="30" y="40" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
      <text x="14" y="82" font-size="15" font-weight="700" fill="#d6dce2">Only that key</text>
      <text x="14" y="102" font-size="15" font-weight="700" fill="#d6dce2">gets an answer</text>
      <text x="14" y="128" font-size="12" fill="#8aa4bd">others are refused and</text>
      <text x="14" y="145" font-size="12" fill="#8aa4bd">logged with their</text>
      <text x="14" y="162" font-size="12" fill="#8aa4bd">fingerprint</text>
    </g>
    <g transform="translate(680 30)">
      <rect width="200" height="190" rx="12" fill="#161d27" stroke="#2d3a4b"/>
      <circle cx="30" cy="34" r="16" fill="#3a7f5a"/><text x="30" y="40" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="14" y="82" font-size="15" font-weight="700" fill="#d6dce2">The client pins</text>
      <text x="14" y="102" font-size="15" font-weight="700" fill="#d6dce2">the server</text>
      <text x="14" y="128" font-size="12" fill="#8aa4bd">by its certificate's</text>
      <text x="14" y="145" font-size="12" fill="#8aa4bd">fingerprint: no authority</text>
      <text x="14" y="162" font-size="12" fill="#8aa4bd">to trust or to be fooled</text>
    </g>
  </g>
</svg>
